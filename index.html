<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supper-Shopper Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-dark);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 24px; margin-bottom: 4px; color: var(--accent-green); }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        select, textarea, input {
            width: 100%;
            padding: 12px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            margin-bottom: 16px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }
        .metric-card {
            background: #334155;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-val { font-size: 20px; font-weight: bold; margin-top: 4px; }
        .card-list { margin-top: 24px; }
        .item-card {
            background: #334155;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-card-title { font-weight: bold; text-transform: capitalize; }
        .item-card-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Supper-Shopper</h1>
    <div class="subtitle">Mobile Optimisation Controller</div>

    <label for="tierSelect">User Account Level</label>
    <select id="tierSelect">
        <option value="premium">Premium Tier (Cross-Store Scan)</option>
        <option value="free">Free Tier (Standard Tesco Baseline)</option>
    </select>

    <label for="receiptInput">Simulated Camera Receipt Text</label>
    <textarea id="receiptInput" rows="5" placeholder="Type items on separate lines...&#10;coffee&#10;bread&#10;milk"></textarea>

    <button onclick="sendScanRequest()">Scan & Optimise Basket</button>

    <div class="metrics-grid">
        <div class="metric-card">
            <div style="color:var(--text-muted); font-size:12px;">Scanned Total</div>
            <div class="metric-val" id="scanTotal">£0.00</div>
        </div>
        <div class="metric-card">
            <div style="color:var(--text-muted); font-size:12px;">Optimised Cost</div>
            <div class="metric-val" id="optTotal" style="color:var(--accent-green);">£0.00</div>
        </div>
    </div>

    <div class="card-list" id="cardContainer"></div>
</div>

<script>
async function sendScanRequest() {
    const rawText = document.getElementById("receiptInput").value;
    const selectTier = document.getElementById("tierSelect").value;
    
    const payload = {
        text: rawText,
        budget: 50.00,
        user_id: 1,
        user_tier: selectTier
    };

    try {
        // Automatically targets your live production backend path cleanly
        const response = await fetch('/api/mobile/scan-receipt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        
        if(data.success) {
            // Update Metric UI elements
            document.getElementById("scanTotal").innerText = `£${data.metrics.scanned_total.toFixed(2)}`;
            document.getElementById("optTotal").innerText = `£${data.metrics.optimized_total.toFixed(2)}`;
            
            // Generate visual list view cards dynamically
            const container = document.getElementById("cardContainer");
            container.innerHTML = ""; // Clear old cards
            
            data.mobile_list_cards.forEach(card => {
                const cardEl = document.createElement("div");
                cardEl.className = "item-card";
                cardEl.innerHTML = `
                    <div>
                        <div class="item-card-title">${card.title}</div>
                        <div class="item-card-sub">${card.subtitle}</div>
                    </div>
                    <div style="font-weight:bold; color:var(--accent-green);">£${card.price.toFixed(2)}</div>
                `;
                container.appendChild(cardEl);
            });
        }
    } catch (err) {
        alert("Connection to live server timed out!");
    }
}
</script>

</body>
</html>
