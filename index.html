<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supper-Shopper App Controller</title>
    <style>
        /* Modern SaaS Dark Core Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .app-header {
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .app-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .app-header .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        .primary-scan-btn {
            width: 100%;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 4px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .primary-scan-btn:hover {
            background-color: var(--accent-green-hover);
        }

        .primary-scan-btn:active {
            transform: scale(0.98);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 4px;
        }

        .metric-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            text-align: left;
        }

        .metric-val {
            font-size: 22px;
            font-weight: 800;
            margin-top: 6px;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .card-list {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .item-card-title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-main);
        }

        .item-card-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .pipeline-stats {
            font-size: 12px;
            color: #a7f3d0;
            background: rgba(16, 185, 129, 0.08);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="brand-info">
            <h1>Supper-Shopper</h1>
            <div class="subtitle">Mobile Optimisation Controller</div>
        </div>
    </header>

    <div class="scanner-card">
        <select id="tierSelect" style="display: none;">
            <option value="premium">Premium Tier</option>
            <option value="free" selected>Free Tier</option>
        </select>

        <div style="margin-bottom: 20px;">
            <label style="display: block; color: #94a3b8; font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Scan Receipt Photo</label>
            <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 96px; background: #0f172a; border: 2px dashed #334155; border-radius: 14px; cursor: pointer;">
                <input type="file" id="receipt-file-input" accept="image/*" capture="environment" onchange="updateUploadStatus()" style="position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2;">
                <div id="upload-status-message" style="text-align: center; color: #64748b; font-size: 14px; pointer-events: none; padding: 0 16px;">
                    <span style="color: #34d399; font-weight: bold; display: block; margin-bottom: 4px;">📷 Tap to Open Camera</span>
                    or select an image from your device
                </div>
            </div>
        </div>

        <div id="pipelineStats" class="pipeline-stats"></div>

        <button onclick="sendScanRequest()" class="primary-scan-btn">Scan & Optimise Basket</button>

        <div class="metrics-grid">
            <div class="metric-card">
                <div style="color: var(--text-muted); font-size: 13px; font-weight: 500;">Scanned Total</div>
                <div class="metric-val" id="scanTotal">£0.00</div>
            </div>
            <div class="metric-card">
                <div style="color: var(--text-muted); font-size: 13px; font-weight: 500;">Optimised Cost</div>
                <div class="metric-val" id="optTotal" style="color: var(--accent-green);">£0.00</div>
            </div>
        </div>
    </div>

    <div class="card-list" id="cardContainer"></div>
</div>

<script>
function updateUploadStatus() {
    const fileInput = document.getElementById("receipt-file-input");
    const statusMsg = document.getElementById("upload-status-message");
    const statsDiv = document.getElementById("pipelineStats");
    if (fileInput && fileInput.files.length > 0 && statusMsg) {
        statusMsg.innerHTML = `<span style="color: #34d399; font-weight: bold;">📁 File Ready:</span> ${fileInput.files[0].name}`;
        if (statsDiv) statsDiv.style.display = "none"; 
    }
}

async function sendScanRequest() {
    const fileInput = document.getElementById("receipt-file-input");
    if (!fileInput || fileInput.files.length === 0) {
        alert("Please snap a photo of a receipt or upload an image first!");
        return;
    }

    const tierSelect = document.getElementById("tierSelect");
    const tierVal = tierSelect ? tierSelect.value : "free";
    const statusMsg = document.getElementById("upload-status-message");
    const statsDiv = document.getElementById("pipelineStats");

    statusMsg.innerText = "Analyzing pixel properties...";

    try {
        const file = fileInput.files[0];

        // 1. Read image properties asynchronously inside user memory
        const img = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = reject;
                image.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });

        // 2. Compute 2K Resampling boundaries (Target Minimum: 2048px)
        const TARGET_MIN_RESOLUTION = 2048;
        let targetWidth = img.width;
        let targetHeight = img.height;

        if (img.width < TARGET_MIN_RESOLUTION && img.height < TARGET_MIN_RESOLUTION) {
            if (img.width >= img.height) {
                targetWidth = TARGET_MIN_RESOLUTION;
                targetHeight = Math.round((img.height * TARGET_MIN_RESOLUTION) / img.width);
            } else {
                targetHeight = TARGET_MIN_RESOLUTION;
                targetWidth = Math.round((img.width * TARGET_MIN_RESOLUTION) / img.height);
            }
        }

        // 3. Render upscale frame to a virtual HTML5 canvas mapping context
        const canvas = document.createElement('canvas');
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

        // Update technical status window overlay
        if (statsDiv) {
            statsDiv.style.display = "block";
            statsDiv.innerHTML = `⚙️ <strong>Upscale Pipeline Log:</strong><br>• Input: ${img.width}x${img.height}px<br>• Processing Scale: ${targetWidth}x${targetHeight}px (2K boosted)`;
        }

        statusMsg.innerText = "Running client-side Tesseract engine...";

        // 4. Run character extraction out of upscaled canvas blob array data
        canvas.toBlob(async (blob) => {
            try {
                const ocrResult = await Tesseract.recognize(
                    blob,
                    'eng',
                    { logger: m => {
                        if (m.status === 'recognizing text') {
                            statusMsg.innerText = `Extracting Text Matrix: ${Math.round(m.progress * 100)}%`;
                        }
                    }}
                );

                const extractedText = ocrResult.data.text;
                console.log("Extracted payload text text array:\n", extractedText);

                if (!extractedText.trim()) {
                    alert("Could not pull text assets out of the framework. Make sure text lines are lit properly.");
                    statusMsg.innerHTML = `<span style="color: #ef4444;">Extraction empty.</span>`;
                    return;
                }

                // 5. Structure payload parameters and deliver text straight to Render Server API endpoint
                const formData = new FormData();
                formData.append("raw_text", extractedText);
                formData.append("budget", "50.00");
                formData.append("user_id", "1");
                formData.append("user_tier", tierVal);

                statusMsg.innerText = "Synchronizing structured shopping matrix...";

                const response = await fetch(`${window.location.origin}/api/mobile/scan-receipt`, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusMsg.innerHTML = `<span style="color: #34d399; font-weight: bold;">✅ Analysis Sync Successful!</span>`;
                    
                    if (document.getElementById("scanTotal")) {
                        document.getElementById("scanTotal").innerText = `£${data.metrics.scanned_total.toFixed(2)}`;
                    }
                    if (document.getElementById("optTotal")) {
                        document.getElementById("optTotal").innerText = `£${data.metrics.optimized_total.toFixed(2)}`;
                    }

                    const container = document.getElementById("cardContainer");
                    if (container) {
                        container.innerHTML = "";
                        data.mobile_list_cards.forEach(card => {
                            const cardEl = document.createElement("div");
                            cardEl.className = "item-card";
                            cardEl.innerHTML = `
                                <div>
                                    <div class="item-card-title">${card.title}</div>
                                    <div class="item-card-sub">${card.subtitle}</div>
                                </div>
                                <div style="font-weight: bold; color: var(--accent-green); font-size: 16px;">£${card.price.toFixed(2)}</div>
                            `;
                            container.appendChild(cardEl);
                        });
                    }
                } else {
                    alert(data.detail || "Server sorting parsing exception.");
                    statusMsg.innerHTML = `<span style="color: #94a3b8;">Processing error.</span>`;
                }
            } catch (ocrErr) {
                console.error("Local Worker Core Exception:", ocrErr);
                alert("Internal failure rendering Tesseract processing array.");
                statusMsg.innerHTML = `<span style="color: #ef4444;">OCR Engine Fault.</span>`;
            }
        }, 'image/jpeg', 0.95);

    } catch (err) {
        console.error("Runtime Exception:", err);
        alert("Network communication sequence error.");
        statusMsg.innerHTML = `<span style="color: #ef4444;">Connection failed.</span>`;
    }
}
</script>

</body>
</html>
