<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supper-Shopper Mobile Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-dark);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 24px; margin-bottom: 4px; color: var(--accent-green); }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        select, textarea, input {
            width: 100%;
            padding: 12px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            margin-bottom: 16px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }
        .metric-card {
            background: #334155;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-val { font-size: 20px; font-weight: bold; margin-top: 4px; }
        .card-list { margin-top: 24px; }
        .item-card {
            background: #334155;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-card-title { font-weight: bold; text-transform: capitalize; }
        .item-card-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        
/* 1. This forces the title and the sign-out button to opposite sides */
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid #1e293b;
}

/* 2. This keeps the sign-out button from stretching out like a large row */
.header-action-btn {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    padding: 8px 16px;       /* Adds padding around the text */
    border-radius: 20px;     /* Gives it a sleek pill look */
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: auto;             /* CRITICAL: Keeps it tight around the word "Sign Out" */
    white-space: nowrap;     /* Prevents the text from wrapping onto two lines */
    transition: all 0.2s ease;
}

.header-action-btn:hover {
    background: #ef4444;
    color: white;
    border-color: #ef4444;
}

/* Enhanced Control Panel Layout Styling */
.scanner-card {
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #334155;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    margin-bottom: 20px;
}

.primary-scan-btn {
    width: 100%;
    padding: 14px;
    background: #10b981;
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 20px;
}

.primary-scan-btn:hover {
    background: #059669;
}


    </style>
</head>
<body>

<div id="auth-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #1e293b; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);">
        <h2 id="auth-title" style="color: #34d399; font-size: 24px; font-weight: bold; margin-bottom: 8px; text-align: center;">Supper-Shopper</h2>
        <p id="auth-subtitle" style="color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 24px;">Sign in to access your budget profile</p>
        
        <div style="margin-bottom: 16px;">
        <label style="display: block; color: #94a3b8; font-size: 12px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase;">Username</label>
        <input type="text" id="auth-username" placeholder="e.g., premium_user" style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 15px; outline: none;">
    </div>

    <div style="margin-bottom: 24px;">
        <label style="display: block; color: #94a3b8; font-size: 12px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase;">Password</label>
        <input type="password" id="auth-password" oninput="checkPasswordStrength()" placeholder="••••••••" style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 15px; outline: none;">
        
        <div id="strength-meter-wrapper" style="display: none; margin-top: 8px;">
            <div style="display: flex; gap: 4px; height: 4px; width: 100%; background: #334155; border-radius: 2px; overflow: hidden; margin-bottom: 4px;">
                <div id="bar-1" style="flex:1; transition: background 0.2s;"></div>
                <div id="bar-2" style="flex:1; transition: background 0.2s;"></div>
                <div id="bar-3" style="flex:1; transition: background 0.2s;"></div>
            </div>
            <span id="strength-text" style="font-size: 11px; color: #64748b; font-weight: 500;">Password requirements unmet.</span>
        </div>
    </div>
        
        <button type="button" onclick="handleAuthSubmit()" style="width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s;">Continue</button>
        
        <div style="text-align: center;">
            <span id="auth-toggle-text" style="color: #64748b; font-size: 14px;">Don't have an account? </span>
            <a href="javascript:void(0)" onclick="toggleAuthMode()" id="auth-toggle-link" style="color: #34d399; font-size: 14px; text-decoration: none; font-weight: 500;">Create Account</a>
        </div>
    </div>
</div>

<div class="app-container">
    <header class="app-header">
        <div class="brand-info">
            <h1>Supper-Shopper</h1>
            <div class="subtitle">Mobile Optimisation Controller</div>
        </div>
        <button id="logout-btn" onclick="handleLogout()" class="header-action-btn">
            Sign Out
        </button>
    </header>

    <div class="scanner-card">
        <select id="tierSelect" style="display: none;">
            <option value="premium">Premium Tier</option>
            <option value="free" selected>Free Tier</option>
        </select>

        <div style="margin-bottom: 20px;">
            <label style="display: block; color: #94a3b8; font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Scan Receipt Photo</label>
            <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 88px; background: #0f172a; border: 2px dashed #334155; border-radius: 12px; cursor: pointer;">
                <input type="file" id="receipt-file-input" accept="image/*" capture="environment" onchange="updateUploadStatus()" style="position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2;">
                <div id="upload-status-message" style="text-align: center; color: #64748b; font-size: 14px; pointer-events: none;">
                    <span style="color: #34d399; font-weight: bold; display: block; margin-bottom: 2px;">📷 Tap to Open Camera</span>
                    or select an image from your device
                </div>
            </div>
        </div>

        <button onclick="sendScanRequest()" class="primary-scan-btn">Scan & Optimise Basket</button>

        <div class="metrics-grid">
            <div class="metric-card">
                <div style="color: var(--text-muted); font-size: 12px;">Scanned Total</div>
                <div class="metric-val" id="scanTotal">£0.00</div>
            </div>
            <div class="metric-card">
                <div style="color: var(--text-muted); font-size: 12px;">Optimised Cost</div>
                <div class="metric-val" id="optTotal" style="color: var(--accent-green);">£0.00</div>
            </div>
        </div>
    </div>

    <div class="card-list" id="cardContainer"></div>
</div>

<script>

let isSignUpMode = false;

function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    const title = document.getElementById("auth-title");
    const subtitle = document.getElementById("auth-subtitle");
    const toggleText = document.getElementById("auth-toggle-text");
    const toggleLink = document.getElementById("auth-toggle-link");

    if (isSignUpMode) {
        title.innerText = "Create Your Account";
        subtitle.innerText = "Join Supper-Shopper to optimize your groceries";
        toggleText.innerText = "Already a member? ";
        toggleLink.innerText = "Sign In";
    } else {
        title.innerText = "Supper-Shopper";
        subtitle.innerText = "Sign in to access your budget profile";
        toggleText.innerText = "Don't have an account? ";
        toggleLink.innerText = "Create Account";
    }
}

// 1. Session Persistence Layer
document.addEventListener("DOMContentLoaded", () => {
    const savedUser = localStorage.getItem("supper_shopper_user");
    const savedTier = localStorage.getItem("supper_shopper_tier");
    
    if (savedUser && savedTier) {
        const overlay = document.getElementById("auth-overlay");
        if (overlay) overlay.style.display = "none";
        
        const selector = document.getElementById("tierSelect");
        if (selector) {
            selector.value = savedTier; // Fixed alignment mapping here
        }
        console.log(`🔄 Session Restored: Signed in as ${savedUser}`);
    }
});

// 2. Real-time strength calculator logic
function checkPasswordStrength() {
    const password = document.getElementById("auth-password").value;
    const meterWrapper = document.getElementById("strength-meter-wrapper");
    
    if (!isSignUpMode) {
        if (meterWrapper) meterWrapper.style.display = "none";
        return 0;
    }
    

    
    if (meterWrapper) meterWrapper.style.display = "block";
    const bar1 = document.getElementById("bar-1");
    const bar2 = document.getElementById("bar-2");
    const bar3 = document.getElementById("bar-3");
    const label = document.getElementById("strength-text");

    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password) && /[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    if (bar1 && bar2 && bar3) {
        bar1.style.background = bar2.style.background = bar3.style.background = "#334155";
    }

    if (label && bar1 && bar2 && bar3) {
        if (score === 0) {
            label.innerText = "Too Short (Min. 8 characters)";
            label.style.color = "#ef4444";
        } else if (score === 1) {
            bar1.style.background = "#ef4444";
            label.innerText = "Weak — Add numbers & capitals";
            label.style.color = "#ef4444";
        } else if (score === 2) {
            bar1.style.background = "#f59e0b";
            bar2.style.background = "#f59e0b";
            label.innerText = "Medium — Add a symbol (!@#$)";
            label.style.color = "#f59e0b";
        } else if (score === 3) {
            bar1.style.background = "#10b981";
            bar2.style.background = "#10b981";
            bar3.style.background = "#10b981";
            label.innerText = "Strong Secure Password Approved";
            label.style.color = "#10b981";
        }
    }
    return score;
}

async function handleAuthSubmit() {
    const userField = document.getElementById("auth-username");
    const passField = document.getElementById("auth-password");
    
    if (!userField || !passField) return;
    
    const userVal = userField.value.trim();
    const passVal = passField.value.trim();
    
    if (!userVal || !passVal) {
        alert("Please enter both a username and a password.");
        return;
    }
    
    // Dynamically build the correct path relative to your Render deployment home URL
    const endpoint = isSignUpMode ? "/api/auth/signup" : "/api/auth/login";
    
    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json" 
            },
            body: JSON.stringify({ username: userVal, password: passVal })
        });
        
        const result = await response.json();
        
        // Enforce strict check on both HTTP status and backend success value
        if (response.ok && result.success === true) {
            if (isSignUpMode) {
                alert("Account created successfully! Switching to sign-in screen.");
                toggleAuthMode();
            } else {
                localStorage.setItem("supper_shopper_user", userVal);
                localStorage.setItem("supper_shopper_tier", result.user_tier || "free");
                
                const overlay = document.getElementById("auth-overlay");
                if (overlay) overlay.style.display = "none";
                
                const tierSelector = document.getElementById("tierSelect");
                if (tierSelector) tierSelector.value = result.user_tier || "free";
                
                alert(`Welcome back ${userVal}!`);
            }
        } else {
            // This reads the explicit "Invalid username or password credentials" string from app.py
            alert(result.detail || "Authentication validation failed.");
        }
    } catch (err) {
        alert("Server connection failed. Please check your network and try again.");
    }
}

// 4. Update the Upload Label Visual Feedback
function updateUploadStatus() {
    const fileInput = document.getElementById("receipt-file-input");
    const statusMsg = document.getElementById("upload-status-message");
    if (fileInput && fileInput.files.length > 0 && statusMsg) {
        statusMsg.innerHTML = `<span style="color: #34d399; font-weight: bold;">📁 File Ready:</span> ${fileInput.files[0].name}`;
    }
}

// 5. Receipt Engine Request Transmission Pipeline
async function sendScanRequest() {
    const fileInput = document.getElementById("receipt-file-input");
    if (!fileInput || fileInput.files.length === 0) {
        alert("Please snap a photo of a receipt or upload an image first!");
        return;
    }

    const tierSelect = document.getElementById("tierSelect");
    const tierVal = tierSelect ? tierSelect.value : "free";

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("budget", "50.00");
    formData.append("user_id", "1");
    formData.append("user_tier", tierVal);

    document.getElementById("upload-status-message").innerText = "Analyzing receipt characters (OCR)...";

    try {
        const response = await fetch(`${window.location.origin}/api/mobile/scan-receipt`, {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
            document.getElementById("upload-status-message").innerHTML = `<span style="color: #34d399; font-weight: bold;">✅ File Processed Successfully!</span>`;
            document.getElementById("scanTotal").innerText = `£${data.metrics.scanned_total.toFixed(2)}`;
            document.getElementById("optTotal").innerText = `£${data.metrics.optimized_total.toFixed(2)}`;

            const container = document.getElementById("cardContainer");
            if (container) {
                container.innerHTML = "";
                data.mobile_list_cards.forEach(card => {
                    const cardEl = document.createElement("div");
                    cardEl.className = "item-card";
                    cardEl.innerHTML = `
                        <div>
                            <div class="item-card-title">${card.title}</div>
                            <div class="item-card-sub">${card.subtitle}</div>
                        </div>
                        <div style="font-weight: bold; color: var(--accent-green);">£${card.price.toFixed(2)}</div>
                    `;
                    container.appendChild(cardEl);
                });
            }
        } else {
            alert(data.detail || "OCR system processing failure.");
            document.getElementById("upload-status-message").innerHTML = `<span style="color: #ef4444;">Processing error.</span>`;
        }
    } catch (err) {
        alert("Network error processing receipt image analysis.");
        document.getElementById("upload-status-message").innerHTML = `<span style="color: #ef4444;">Connection failed.</span>`;
    }
}

function handleLogout() {
    // 1. Wipe out the saved user session memory
    localStorage.removeItem("supper_shopper_user");
    localStorage.removeItem("supper_shopper_tier");
    
    // 2. Bring back the mobile login screen overlay instantly
    const overlay = document.getElementById("auth-overlay");
    if (overlay) {
        overlay.style.display = "flex";
    }
    
    // 3. Reset the input text boxes so they are completely clean
    const userField = document.getElementById("auth-username");
    const passField = document.getElementById("auth-password");
    if (userField) userField.value = "";
    if (passField) passField.value = "";
    
    alert("You have logged out successfully.");
}

</script>

</body>
</html>
