<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supper-Shopper Mobile Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-dark);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 24px; margin-bottom: 4px; color: var(--accent-green); }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        select, textarea, input {
            width: 100%;
            padding: 12px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            margin-bottom: 16px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }
        .metric-card {
            background: #334155;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-val { font-size: 20px; font-weight: bold; margin-top: 4px; }
        .card-list { margin-top: 24px; }
        .item-card {
            background: #334155;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-card-title { font-weight: bold; text-transform: capitalize; }
        .item-card-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    </style>
</head>
<body>

<div id="auth-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #1e293b; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);">
        <h2 id="auth-title" style="color: #34d399; font-size: 24px; font-weight: bold; margin-bottom: 8px; text-align: center;">Supper-Shopper</h2>
        <p id="auth-subtitle" style="color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 24px;">Sign in to access your budget profile</p>
        
        <div style="margin-bottom: 16px;">
            <label style="display: block; color: #94a3b8; font-size: 12px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase;">Username</label>
            <input type="text" id="auth-username" placeholder="e.g., premium_user" style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 15px; outline: none;">
        </div>
        
        <div style="margin-bottom: 24px;">
            <label style="display: block; color: #94a3b8; font-size: 12px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase;">Password</label>
            <input type="password" id="auth-password" placeholder="••••••••" style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 15px; outline: none;">
        </div>
        
        <button onclick="handleAuthSubmit()" style="width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-bottom: 16px;">Continue</button>
        
        <div style="text-align: center;">
            <span id="auth-toggle-text" style="color: #64748b; font-size: 14px;">Don't have an account? </span>
            <a href="javascript:void(0)" onclick="toggleAuthMode()" id="auth-toggle-link" style="color: #34d399; font-size: 14px; text-decoration: none; font-weight: 500;">Create Account</a>
        </div>
    </div>
</div>

<div class="app-container">
    <h1>Supper-Shopper</h1>
    <div class="subtitle">Mobile Optimisation Controller</div>

    <label for="tierSelect">User Account Level</label>
    <select id="tierSelect">
        <option value="premium">Premium Tier (Cross-Store Scan)</option>
        <option value="free">Free Tier (Standard Tesco Baseline)</option>
    </select>

    <div style="margin-bottom: 20px;">
    <label style="display: block; color: #94a3b8; font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Scan Receipt Photo</label>
    <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 80px; background: #0f172a; border: 2px dashed #334155; border-radius: 12px; transition: border-color 0.2s; cursor: pointer;">
        <input type="file" id="receipt-file-input" accept="image/*" capture="environment" onchange="updateUploadStatus()" style="position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10;">
        <div id="upload-status-message" style="text-align: center; color: #64748b; font-size: 14px; pointer-events: none;">
            <span style="color: #34d399; font-weight: bold; display: block; margin-bottom: 2px;">📸 Tap to Open Camera</span>
            or select an image from your device
        </div>
    </div>
</div>

    <button onclick="sendScanRequest()">Scan & Optimise Basket</button>

    <div class="metrics-grid">
        <div class="metric-card">
            <div style="color:var(--text-muted); font-size:12px;">Scanned Total</div>
            <div class="metric-val" id="scanTotal">£0.00</div>
        </div>
        <div class="metric-card">
            <div style="color:var(--text-muted); font-size:12px;">Optimised Cost</div>
            <div class="metric-val" id="optTotal" style="color:var(--accent-green);">£0.00</div>
        </div>
    </div>

    <div class="card-list" id="cardContainer"></div>
</div>

<script>

let isSignUpMode = false;

function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    const title = document.getElementById("auth-title");
    const subtitle = document.getElementById("auth-subtitle");
    const toggleText = document.getElementById("auth-toggle-text");
    const toggleLink = document.getElementById("auth-toggle-link");
    
    if (isSignUpMode) {
        title.innerText = "Create Your Account";
        subtitle.innerText = "Join Supper-Shopper to optimize your groceries";
        toggleText.innerText = "Already a member? ";
        toggleLink.innerText = "Sign In";
    } else {
        title.innerText = "Supper-Shopper";
        subtitle.innerText = "Sign in to access your budget profile";
        toggleText.innerText = "Don't have an account? ";
        toggleLink.innerText = "Create Account";
    }
}

async function handleAuthSubmit() {
    const userVal = document.getElementById("auth-username").value;
    const passVal = document.getElementById("auth-password").value;
    
    if (!userVal || !passVal) {
        alert("Please complete all profile credentials!");
        return;
    }
    
    const base = window.location.origin;
    const endpoint = isSignUpMode ? `${base}/api/auth/signup` : `${base}/api/auth/login`;

    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: userVal, password: passVal })
        });
        
        const result = await response.json();
        
        if (response.ok) {
            if (isSignUpMode) {
                alert("Success! Now log in with your credentials.");
                toggleAuthMode();
            } else {
                // Successfully logged in! Hide the modal and unlock dashboard
                document.getElementById("auth-overlay").style.display = "none";
                
                // Set the premium or free user tier drop-down automatically from session state data
                if(result.user_tier === "premium") {
                     document.getElementById("user-tier-selector").value = "premium";
                }
                alert(`Welcome back, ${userVal}!`);
            }
        } else {
            alert(result.detail || "Authentication validation failure.");
        }
    } catch (err) {
        alert("Server connection timed out.");
    }
}

function updateUploadStatus() {
    const fileInput = document.getElementById("receipt-file-input");
    const statusMsg = document.getElementById("upload-status-message");
    if(fileInput && fileInput.files.length > 0) {
        statusMsg.innerHTML = `<span style="color: #34d399; font-weight: bold;">✅ File Ready:</span> ${fileInput.files[0].name}`;
    }
}

async function sendScanRequest() {
    const fileInput = document.getElementById("receipt-file-input");
    if (!fileInput || fileInput.files.length === 0) {
        alert("Please snap a photo of a receipt or upload an image first!");
        return;
    }

    const tierSelect = document.getElementById("user-tier-selector") || document.getElementById("TierSelect");
    const tierVal = tierSelect ? tierSelect.value : "free";
    
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("budget", "50.00");
    formData.append("user_id", "1");
    formData.append("user_tier", tierVal);

    document.getElementById("upload-status-message").innerText = "Analyzing receipt characters (OCR)...";

    try {
        const response = await fetch(`${window.location.origin}/api/mobile/scan-receipt`, {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        
        if (response.ok && data.success) {
            // Reset upload message wrapper back to baseline target state
            document.getElementById("upload-status-message").innerHTML = `<span style="color: #34d399; font-weight: bold; display: block; margin-bottom: 2px;">📸 Tap to Open Camera</span>or select an image from your device`;
            
            // Update Metric UI elements exactly like your old code
            document.getElementById("scanTotal").innerText = `£${data.metrics.scanned_total.toFixed(2)}`;
            document.getElementById("optTotal").innerText = `£${data.metrics.optimized_total.toFixed(2)}`;

            // Generate visual list view cards dynamically
            const container = document.getElementById("cardContainer");
            container.innerHTML = ""; // Clear old cards

            data.mobile_list_cards.forEach(card => {
                const cardEl = document.createElement("div");
                cardEl.className = "item-card";
                cardEl.innerHTML = `
                    <div>
                        <div class="item-card-title">${card.title}</div>
                        <div class="item-card-sub">${card.subtitle}</div>
                    </div>
                    <div style="font-weight:bold; color:var(--accent-green);">£${card.price.toFixed(2)}</div>
                `;
                container.appendChild(cardEl);
            });
        } else {
            alert(data.detail || "OCR system processing failure.");
            document.getElementById("upload-status-message").innerHTML = `<span style="color: #34d399; font-weight: bold; display: block; margin-bottom: 2px;">📸 Tap to Open Camera</span>or select an image from your device`;
        }
    } catch (err) {
        alert("Network error processing receipt image analysis.");
        document.getElementById("upload-status-message").innerHTML = `<span style="color: #34d399; font-weight: bold; display: block; margin-bottom: 2px;">📸 Tap to Open Camera</span>or select an image from your device`;
    }
}
</script>

</body>
</html>
